name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: |
          developer_dir=$(scripts/select-xcode.sh)
          echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"
          export DEVELOPER_DIR="$developer_dir"
          xcodebuild -version
          swift --version
          sdk=$(xcrun --sdk macosx --show-sdk-version)
          echo "macOS SDK $sdk"
          sdk_major=${sdk%%.*}
          if [[ "$sdk_major" -lt 27 ]]; then
            echo "::error::the build needs the macOS 27 SDK, the selected Xcode ships $sdk"
            exit 1
          fi
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Lint formatting
        run: swift format lint --strict --recursive Sources Tests Package.swift
